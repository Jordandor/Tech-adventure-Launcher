name: Install and release launcher 0.2.15

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use uploaded skins for online player heads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skinPath = "src/renderer/skin-server.js"
          $skinSource = [System.IO.File]::ReadAllText($skinPath)
          $oldLine = "const skin = await api.getSkin(name, 'game');"
          $newLine = "const skin = await api.getSkin(name, 'uploaded');"

          if ($skinSource.Contains($oldLine)) {
            $skinSource = $skinSource.Replace($oldLine, $newLine)
            [System.IO.File]::WriteAllText(
              $skinPath,
              $skinSource,
              [System.Text.UTF8Encoding]::new($false)
            )
          } elseif (-not $skinSource.Contains($newLine)) {
            throw "Не найден вызов получения скина для головы игрока."
          }

          @'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.version = '0.2.15';
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8');

          const lockPath = 'package-lock.json';
          const lockJson = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lockJson.version = '0.2.15';
          if (!lockJson.packages || !lockJson.packages['']) {
            throw new Error('В package-lock.json не найден корневой пакет.');
          }
          lockJson.packages[''].version = '0.2.15';
          fs.writeFileSync(lockPath, `${JSON.stringify(lockJson, null, 2)}\n`, 'utf8');
          '@ | node -

          @'
          # Tech Adventure Launcher 0.2.15

          - Головы игроков в списке онлайна теперь всегда берутся из `skins_uploaded`.
          - Обработанные файлы из `skins_processed` по-прежнему используются только внутри Minecraft.
          - Трёхмерная модель скина в лаунчере также продолжает использовать `skins_uploaded`.
          '@ | Set-Content -Path "RELEASE-NOTES-0.2.15.md" -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Build Windows installer and portable version
        run: npm run dist:win -- --publish never

      - name: Commit launcher sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json src/renderer/skin-server.js RELEASE-NOTES-0.2.15.md

          if (git diff --cached --quiet) {
            Write-Host "Launcher sources are already at 0.2.15."
          } else {
            git commit -m "Launcher 0.2.15: use uploaded skins for online heads"
            git push origin HEAD:main
          }

      - name: Publish launcher 0.2.15 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (gh release view v0.2.15 2>$null) {
            throw "Release v0.2.15 already exists."
          }

          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Extension -in @(".exe", ".yml", ".blockmap")
          } | ForEach-Object { $_.FullName }

          if (-not $assets -or $assets.Count -eq 0) {
            throw "Build assets were not found in dist."
          }

          $target = (git rev-parse HEAD).Trim()
          gh release create v0.2.15 @assets `
            --target $target `
            --title "Tech Adventure Launcher 0.2.15" `
            --notes-file RELEASE-NOTES-0.2.15.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Adventure-Launcher-0.2.15-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
