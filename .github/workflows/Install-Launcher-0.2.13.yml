name: Install and release launcher 0.2.13

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Write launcher 0.2.13 files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            @{ Path = "package.json"; Data = "" },
            @{ Path = "src/main-wrapper.js"; Data = "" },
            @{ Path = "src/preload-wrapper.js"; Data = "" },
            @{ Path = "src/renderer/skin-server.js"; Data = "" },
            @{ Path = "src/renderer/skin-server.css"; Data = "" },
            @{ Path = "apply-update.mjs"; Data = "" },
            @{ Path = "RELEASE-NOTES-0.2.13.md"; Data = "" }
          )
          foreach ($file in $files) {
            $parent = Split-Path -Parent $file.Path
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            [System.IO.File]::WriteAllBytes($file.Path, [Convert]::FromBase64String($file.Data))
          }
          node apply-update.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Build Windows installer and portable version
        run: npm run dist:win -- --publish never

      - name: Commit launcher sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/main-wrapper.js src/preload-wrapper.js src/renderer/index.html src/renderer/skin-server.js src/renderer/skin-server.css RELEASE-NOTES-0.2.13.md
          if (git diff --cached --quiet) {
            Write-Host "Launcher sources are already at 0.2.13."
          } else {
            git commit -m "Launcher 0.2.13: server skins and online player list"
            git push origin HEAD:main
          }

      - name: Publish launcher 0.2.13 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (gh release view v0.2.13 2>$null) {
            throw "Release v0.2.13 already exists."
          }
          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Extension -in @(".exe", ".yml", ".blockmap")
          } | ForEach-Object { $_.FullName }
          if (-not $assets -or $assets.Count -eq 0) { throw "Build assets were not found in dist." }
          $target = (git rev-parse HEAD).Trim()
          gh release create v0.2.13 @assets --target $target --title "Tech Adventure Launcher 0.2.13" --notes-file RELEASE-NOTES-0.2.13.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Adventure-Launcher-0.2.13-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
