name: Build launcher

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Build Windows installer and portable version
        run: npm run dist:win -- --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Adventure-Launcher-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
